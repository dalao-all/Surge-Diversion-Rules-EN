name: Surge English verified mirror
on:
  schedule:
    - cron: '7 22 * * *' # Beijing 06:07; synchronize the latest verified canonical snapshot
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/sync_from_canonical.py', 'scripts/generate_repository_status.py', 'profiles/surge-V3.0.0.conf', '.github/workflows/rulekit-v4.yml']
  pull_request:
    paths: ['scripts/sync_from_canonical.py', 'scripts/generate_repository_status.py', 'profiles/surge-V3.0.0.conf', '.github/workflows/rulekit-v4.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: surge-english-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify synchronization logic
        run: python -m unittest discover -s scripts -p test_sync.py -v
      - name: Pull pinned verified canonical snapshot and validate it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_from_canonical.py
      - name: Audit English documentation and website
        run: python scripts/audit_repository.py
      - name: Publish only if mirror input is still current
        if: github.event_name != 'pull_request'
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$INPUT_SHA" ]; then
            echo 'English repository changed during synchronization. Refusing stale publish.'
            exit 1
          fi
          git add rulekit_v4 dist/v4 profiles/surge-V3.0.0.conf profiles/Surge-v4.template.conf scripts/generate_repository_status.py scripts/sync_from_canonical.py scripts/audit_repository.py scripts/test_sync.py repository-status.json mirror-state.json docs/APP_POLICY_MATRIX.md
          if git diff --cached --quiet; then
            echo 'English mirror already matches the verified canonical release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'surge-en-mirror-bot'
          git config user.email 'surge-en-mirror-bot@users.noreply.github.com'
          git commit -m 'sync: mirror verified canonical Surge release'
          git push origin HEAD:main
      - name: Failure summary
        if: failure()
        run: echo 'Mirror failed; previous published English resources remain available. No cross-repository write token is used.' >> "$GITHUB_STEP_SUMMARY"
