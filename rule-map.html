<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MESL Surge V6.0 · 规则神经网络拓扑</title>
<style>
:root {
  --bg: #070b14;
  --bg2: #0d1526;
  --panel: rgba(12, 20, 40, 0.92);
  --border: rgba(80, 140, 255, 0.25);
  --text: #d8e6ff;
  --muted: #7a8fb0;
  --neon: #4de1ff;
  --neon2: #a78bfa;
  --green: #34d399;
  --red: #f87171;
  --purple: #c084fc;
  --pink: #f472b6;
  --gold: #fbbf24;
  --cyan: #22d3ee;
  --blue: #60a5fa;
  --orange: #fb923c;
  --region: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
header {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px;
  background: linear-gradient(180deg, #0f1a30, #0a1222);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
header h1 {
  font-size: 15px; font-weight: 650; letter-spacing: 0.02em;
  background: linear-gradient(90deg, var(--neon), var(--neon2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--muted); background: rgba(30,50,90,0.4);
}
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.controls input[type="search"] {
  width: 220px; max-width: 40vw; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: #0a1424; color: var(--text); outline: none;
}
.controls input:focus { border-color: var(--neon); box-shadow: 0 0 0 2px rgba(77,225,255,0.15); }
.btn {
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(30,50,90,0.5); color: var(--text); cursor: pointer; font-size: 12px;
}
.btn:hover { border-color: var(--neon); color: var(--neon); }
.btn.active { background: rgba(77,225,255,0.15); border-color: var(--neon); color: var(--neon); }
.main { flex: 1; display: flex; min-height: 0; position: relative; }
#canvas-wrap {
  flex: 1; position: relative; overflow: hidden; background:
    radial-gradient(ellipse at 20% 50%, rgba(77,225,255,0.05), transparent 50%),
    radial-gradient(ellipse at 80% 40%, rgba(167,139,250,0.06), transparent 45%),
    var(--bg);
  cursor: grab;
}
#canvas-wrap.dragging { cursor: grabbing; }
canvas#net { position: absolute; inset: 0; width: 100%; height: 100%; }
.side {
  width: 340px; max-width: 40vw; flex: 0 0 auto;
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.side h2 { font-size: 13px; padding: 12px 14px 6px; color: var(--neon); border-bottom: 1px solid var(--border); }
.side .body { flex: 1; overflow: auto; padding: 10px 14px; font-size: 12px; line-height: 1.55; }
.side .body::-webkit-scrollbar { width: 6px; }
.side .body::-webkit-scrollbar-thumb { background: #334; border-radius: 3px; }
.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 8px; margin-bottom: 10px; }
.kv .k { color: var(--muted); }
.kv .v { word-break: break-all; }
.tag {
  display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
  margin: 2px 2px 2px 0; border: 1px solid;
}
.tag.direct { color: var(--green); border-color: var(--green); }
.tag.reject { color: var(--red); border-color: var(--red); }
.tag.ai { color: var(--purple); border-color: var(--purple); }
.tag.tiktok { color: var(--pink); border-color: var(--pink); }
.tag.finance { color: var(--gold); border-color: var(--gold); }
.tag.stream { color: var(--cyan); border-color: var(--cyan); }
.tag.intl { color: var(--blue); border-color: var(--blue); }
.tag.module, .tag.orange { color: var(--orange); border-color: var(--orange); }
.tag.region { color: var(--region); border-color: var(--region); }
.tag.other { color: var(--muted); border-color: var(--muted); }
.raw {
  margin-top: 8px; padding: 8px; background: #060a12; border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
  white-space: pre-wrap; word-break: break-all; color: #b8c8e8;
  border: 1px solid #1a2740;
}
.legend {
  position: absolute; left: 12px; bottom: 48px; z-index: 5;
  background: rgba(8,14,28,0.88); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; font-size: 11px; backdrop-filter: blur(8px);
  max-width: 220px;
}
.legend h3 { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
.callout {
  position: absolute; top: 12px; left: 12px; z-index: 5;
  background: rgba(8,14,28,0.88); border: 1px solid rgba(251,191,36,0.35);
  border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--gold);
  max-width: 280px; backdrop-filter: blur(8px);
}
footer {
  flex: 0 0 auto; padding: 6px 14px; font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--border); background: #080e1a;
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
}
footer strong { color: var(--neon); font-weight: 600; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
.list-item {
  padding: 6px 8px; margin: 3px 0; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; background: rgba(20,35,70,0.35);
}
.list-item:hover, .list-item.active { border-color: var(--neon); background: rgba(77,225,255,0.08); }
.list-item .t { font-size: 10px; color: var(--muted); }
.hint { color: var(--muted); font-size: 11px; margin-top: 8px; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; flex-wrap: wrap; }
.tab {
  font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); color: var(--muted);
}
.tab.active { color: var(--neon); border-color: var(--neon); background: rgba(77,225,255,0.1); }
#minimap {
  position: absolute; right: 352px; bottom: 48px; width: 140px; height: 80px;
  border: 1px solid var(--border); border-radius: 6px; background: rgba(0,0,0,0.5);
  z-index: 5; pointer-events: none; display: none;
}
@media (max-width: 800px) {
  .side { width: 100%; max-width: 100%; position: absolute; right: 0; top: 0; bottom: 0;
    transform: translateX(100%); transition: transform .2s; z-index: 30; }
  .side.open { transform: translateX(0); }
}

.lang-switch { display:inline-flex; gap:4px; margin-left:8px; }
.lang-switch button { padding:4px 10px; border-radius:8px; border:1px solid var(--border); background:rgba(30,50,90,0.5); color:var(--muted); cursor:pointer; font-size:12px; }
.lang-switch button.active { background:rgba(77,225,255,0.15); border-color:var(--neon); color:var(--neon); }

</style>
</head>
<body>
<header>
  <h1>MESL Surge V6.0 · Rule Neural Map</h1>
<div class="lang-switch" title="Language">
  <button type="button" id="lang-en" class="active" onclick="setLang('en')">EN</button>
  <button type="button" id="lang-zh" onclick="setLang('zh')">中文</button>
</div>
  <span class="badge" id="stat-total">规则 —</span>
  <span class="badge" id="stat-conf">主配置 —</span>
  <span class="badge" id="stat-mod">模块 —</span>
  <div class="controls">
    <input type="search" id="search" placeholder="搜索域名 / 关键词 / 策略…" autocomplete="off"/>
    <button class="btn" id="btn-expand" title="将每个规则绘制为独立节点">展开全部规则节点</button>
    <button class="btn" id="btn-reset" title="恢复舒适默认相机（非压扁全图）">重置视图</button>
    <button class="btn" id="btn-anim" class="active">动画 ON</button>
  </div>
</header>
<div class="main">
  <div id="canvas-wrap">
    <div class="callout">⚡ 匹配优先级：自上而下（左层靠前）· 默认已拉开间距，滚轮放大看细节 · 远程 RULE-SET 不展开</div>
    <div class="legend" id="legend">
      <h3>图例 · 动作着色</h3>
      <div class="row"><span class="dot" style="color:var(--green);background:var(--green)"></span> DIRECT 直连</div>
      <div class="row"><span class="dot" style="color:var(--red);background:var(--red)"></span> REJECT / DROP</div>
      <div class="row"><span class="dot" style="color:var(--purple);background:var(--purple)"></span> 🤖 AI住宅</div>
      <div class="row"><span class="dot" style="color:var(--pink);background:var(--pink)"></span> 🎵 TikTok</div>
      <div class="row"><span class="dot" style="color:var(--gold);background:var(--gold)"></span> 金融 / 支付</div>
      <div class="row"><span class="dot" style="color:var(--cyan);background:var(--cyan)"></span> 🎬 流媒体</div>
      <div class="row"><span class="dot" style="color:var(--blue);background:var(--blue)"></span> 🌍 国际网络</div>
      <div class="row"><span class="dot" style="color:var(--orange);background:var(--orange)"></span> 模块广告拦截</div>
      <div class="row"><span class="dot" style="color:var(--region);background:var(--region)"></span> 区域池 / 其他</div>
      <div style="margin-top:6px;color:var(--muted)">默认已拉开间距，滚轮放大看细节</div>
      <div style="margin-top:2px;color:var(--muted)">拖拽平移 · 点击节点高亮连边</div>
    </div>
    <canvas id="net"></canvas>
  </div>
  <aside class="side" id="side">
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="detail" data-tab="detail">详情</div>
      <div class="tab" data-tab="stats" data-tab="stats">统计</div>
      <div class="tab" data-tab="module">模块改写</div>
      <div class="tab" data-tab="general" data-tab="general" data-tab="general" data-tab="general">General</div>
    </div>
    <div class="body" id="panel-body">
      <p class="hint">点击左侧节点查看规则 / 策略详情。</p>
    </div>
  </aside>
</div>
<footer id="footer">
  <span>完整性校验中…</span>
</footer>

":"高德-03","raw":"高德-03 = type=http-response, pattern=^https:\\/\\/m5-zb\\.amap\\.com\\/ws\\/promotion-web\\/resource, script-path=https://raw.githubusercontent.com/kokoryh/Script/master/js/amap.js, requires-body=true, max-size=524288, timeout=10, script-update-interval=86400","config":"type=http-response, pattern=^https:\\/\\/m5-zb\\.amap\\.com\\/ws\\/promotion-web\\/resource, script-path=https://raw.githubusercontent.com/kokoryh/Script/master/js/amap.js, requires-body=true, max-size=524288, timeout=10, script-update-interval=86400"},{"name":"高德-04","raw":"高德-04 = type=http-response, pattern=^https:\\/\\/m5\\.amap\\.com\\/ws\\/shield\\/dsp\\/profile\\/index\\/nodefaas, script-path=https://raw.githubusercontent.com/kokoryh/Script/master/js/amap.js, requires-body=true, max-size=524288, timeout=10, script-update-interval=86400","config":"type=http-response, pattern=^https:\\/\\/m5\\.amap\\.com\\/ws\\/shield\\/dsp\\/profile\\/index\\/nodefaas, script-path=https://raw.githubusercontent.com/kokoryh/Script/master/js/amap.js, requires-body=true, max-size=524288, timeout=10, script-update-interval=86400"}],"mitm_hostnames":["app.bilibili.com","api.coolapk.com","acs.m.taobao.com","guide-acs.m.taobao.com","poplayer.template.alibaba.com","api.m.jd.com","edith.xiaohongshu.com","www.xiaohongshu.com","so.xiaohongshu.com","m5.amap.com","m5-zb.amap.com"],"mitm_raw":["h2 = true","hostname = %APPEND% app.bilibili.com, api.coolapk.com, acs.m.taobao.com, guide-acs.m.taobao.com, poplayer.template.alibaba.com, api.m.jd.com, edith.xiaohongshu.com, www.xiaohongshu.com, so.xiaohongshu.com, m5.amap.com, m5-zb.amap.com"]},"policy_counts":{"🤖 AI住宅":190,"REJECT":121,"DIRECT":112,"🪙 数字资产":51,"🎵 TikTok":45,"🌍 国际网络":33,"🎬 流媒体":24,"REJECT-DROP":13,"💳 Bybit 全球":12,"REJECT-NO-DROP":8,"💰 PayPal":7,"🇬🇧 英国专属":3,"🇩🇪 Bybit 欧洲":2,"🇯🇵 日本节点池":2,"🇨🇳 台湾机房池":2,"🇬🇧 英国机房池":2,"🇺🇸 美国机房池":1},"warnings":[],"completeness":{"conf_raw":570,"conf_parsed":570,"module_raw":58,"module_parsed":58,"missing_conf":0,"missing_module":0,"ok":true}}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("DATA").textContent);
console.log("[] conf rules:", DATA.meta.conf_rules, "module:", DATA.meta.module_rules, "total:", DATA.meta.total_rules);
console.log("[] completeness:", DATA.completeness);
console.log("[] policy counts:", DATA.policy_counts);
if (DATA.warnings && DATA.warnings.length) console.warn("[] warnings:", DATA.warnings);

const COLORS = {
  direct: "#34d399", reject: "#f87171", ai: "#c084fc", tiktok: "#f472b6",
  finance: "#fbbf24", stream: "#22d3ee", intl: "#60a5fa", module: "#fb923c",
  orange: "#fb923c", region: "#94a3b8", other: "#7a8fb0",
  section: "#4de1ff", pool: "#a78bfa", upstream: "#e879f9", edge: "rgba(100,160,255,0.25)"
};

function policyKey(policy) {
  const p = (policy || "").toUpperCase();
  const name = policy || "";
  if (p.includes("REJECT") || p.includes("DROP")) return "reject";
  if (p === "DIRECT" || name === "DIRECT") return "direct";
  if (name.includes("AI") || name.includes("🤖")) return "ai";
  if (name.includes("TikTok") || name.includes("🎵")) return "tiktok";
  if (/数字资产|Bybit|PayPal|🪙|💳|💰/.test(name)) return "finance";
  if (name.includes("流媒体") || name.includes("🎬")) return "stream";
  if (name.includes("国际") || name.includes("🌍")) return "intl";
  if (/英国|德国|日本|台湾|美国|🇨🇳|🇩🇪|🇬🇧|🇯🇵|🇺🇸/.test(name)) return "region";
  return "other";
}

const canvas = document.getElementById("net");
const wrap = document.getElementById("canvas-wrap");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
let cam = { x: 36, y: 48, scale: 1.08 };
let dragging = false, lastX = 0, lastY = 0;
let expandAll = false;
let animOn = true;
let searchQ = "";
let selected = null;
let nodes = [];
let edges = [];
let particles = [];
let hover = null;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", () => { resize(); });

// ---------- Graph build ----------
const sectionLabel = {};
DATA.sections.forEach(s => { sectionLabel[s.id] = s.label; });

function buildGraph() {
  nodes = []; edges = []; particles = [];
  const bySection = {};
  DATA.rules.forEach(r => {
    (bySection[r.section] = bySection[r.section] || []).push(r);
  });

  // Layer X positions — wide horizontal gaps (world coords)
  const LX = { A: 100, B: 560, C: 1050, D: 1500 };
  let yA = 80;
  const sectionNodes = {};
  const policyNodes = {};
  const poolNodes = {};

  // Layer A — sections (ordered), large vertical spacing ~100px
  const secOrder = DATA.sections.filter(s => (bySection[s.id] || []).length > 0 || s.id === "1.5-app");
  secOrder.forEach((s, i) => {
    const rules = bySection[s.id] || [];
    const n = {
      id: "sec:" + s.id, kind: "section", layer: "A",
      label: s.label, count: rules.length, section: s.id,
      x: LX.A, y: yA, r: 7 + Math.min(5, Math.sqrt(rules.length) * 0.35),
      color: s.id.startsWith("module") ? COLORS.module : COLORS.section,
      rules
    };
    sectionNodes[s.id] = n;
    nodes.push(n);
    yA += 100 + Math.min(16, rules.length * 0.04);
  });

  // Layer C — policy groups (~70px spacing)
  const policiesFromRules = new Set(DATA.rules.map(r => r.policy));
  const groups = DATA.proxy_groups || [];
  const visibleGroups = groups.filter(g => !g.hidden && !g.is_upstream);
  const pools = groups.filter(g => g.is_pool || g.hidden);
  const upstream = groups.filter(g => g.is_upstream);

  let yC = 80;
  function addPolicyNode(name, extra) {
    if (policyNodes[name]) return policyNodes[name];
    const key = policyKey(name);
    const n = {
      id: "pol:" + name, kind: "policy", layer: "C",
      label: name, count: DATA.policy_counts[name] || 0,
      x: LX.C, y: yC, r: 8,
      color: COLORS[key] || COLORS.other,
      policy: name, ...extra
    };
    policyNodes[name] = n;
    nodes.push(n);
    yC += 70;
    return n;
  }

  // Builtin
  ["DIRECT", "REJECT", "REJECT-DROP", "REJECT-NO-DROP"].forEach(p => {
    if (policiesFromRules.has(p)) addPolicyNode(p, { builtin: true });
  });
  visibleGroups.forEach(g => addPolicyNode(g.name, { group: g }));
  // any remaining policies referenced by rules
  policiesFromRules.forEach(p => {
    if (!policyNodes[p]) addPolicyNode(p, {});
  });

  // Layer D — pools + upstream (~60px)
  let yD = 100;
  pools.forEach(g => {
    const n = {
      id: "pool:" + g.name, kind: "pool", layer: "D",
      label: g.name, x: LX.D, y: yD, r: 7,
      color: COLORS.pool, group: g
    };
    poolNodes[g.name] = n;
    nodes.push(n);
    yD += 60;
  });
  upstream.forEach(g => {
    const n = {
      id: "up:" + g.name, kind: "upstream", layer: "D",
      label: g.name + " (你的订阅)",
      x: LX.D + 60, y: yD + 20, r: 10,
      color: COLORS.upstream, group: g
    };
    poolNodes[g.name] = n;
    nodes.push(n);
    yD += 70;
  });

  function addEdge(a, b, color, weight) {
    edges.push({ a, b, color: color || COLORS.edge, weight: weight || 1, particles: [] });
  }

  if (!expandAll) {
    // Cluster mode: section → each distinct policy used in section
    Object.keys(sectionNodes).forEach(sid => {
      const sn = sectionNodes[sid];
      const polCount = {};
      sn.rules.forEach(r => { polCount[r.policy] = (polCount[r.policy] || 0) + 1; });
      Object.keys(polCount).forEach(p => {
        const pn = policyNodes[p];
        if (pn) addEdge(sn, pn, pn.color, Math.min(8, 1 + Math.log2(polCount[p] + 1)));
      });
    });
  } else {
    // Expand: multi-column layout under Layer B (≥16px row pitch, 5 cols)
    const COLS = 5;
    const COL_W = 150;
    const ROW_H = 18;
    DATA.rules.forEach((r, idx) => {
      const sn = sectionNodes[r.section];
      const col = COLORS[policyKey(r.policy)] || COLORS.other;
      const color = r.source === "module" && (r.policy === "REJECT" || r.policy.startsWith("REJECT"))
        ? COLORS.module : col;
      const c = idx % COLS;
      const row = Math.floor(idx / COLS);
      const n = {
        id: r.id, kind: "rule", layer: "B",
        label: shortLabel(r), rule: r,
        x: LX.B + c * COL_W, y: 50 + row * ROW_H, r: r.remote ? 3.2 : 2.2,
        color: color, remote: r.remote
      };
      nodes.push(n);
      if (sn) addEdge(sn, n, color, 0.6);
      const pn = policyNodes[r.policy];
      if (pn) addEdge(n, pn, color, 0.8);
    });
  }

  // Policy → pools via include-other-group
  groups.forEach(g => {
    const from = policyNodes[g.name] || poolNodes[g.name];
    if (!from) return;
    (g.include || []).forEach(inc => {
      const to = poolNodes[inc] || policyNodes[inc];
      if (to) addEdge(from, to, COLORS.pool, 2);
    });
  });
  // Pools → upstream 
  pools.forEach(g => {
    const from = poolNodes[g.name];
    (g.include || []).forEach(inc => {
      const to = poolNodes[inc];
      if (from && to) addEdge(from, to, COLORS.upstream, 2.5);
    });
  });

  // Particles seed — kept on all edges; draw only highlights them
  edges.forEach(e => {
    const n = Math.min(3, Math.max(1, Math.floor(e.weight)));
    for (let i = 0; i < n; i++) {
      particles.push({ e, t: Math.random(), speed: 0.002 + Math.random() * 0.004, r: 1.2 + Math.random() });
    }
  });

  setComfortableCamera();
}

function setComfortableCamera() {
  // Do NOT fit entire tall graph into viewport — comfortable readable scale
  cam.scale = 1.08;
  cam.x = 36;
  cam.y = 48;
}

function shortLabel(r) {
  if (r.type === "FINAL") return "FINAL → " + r.policy;
  if (r.remote) {
    const u = r.value || "";
    const leaf = u.split("/").pop() || u;
    return r.type + " ☁ " + leaf;
  }
  const v = (r.value || "").slice(0, 36);
  return r.type + " " + v;
}

// ---------- Interaction ----------
wrap.addEventListener("wheel", ev => {
  ev.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const worldX = (mx - cam.x) / cam.scale, worldY = (my - cam.y) / cam.scale;
  const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  cam.scale = Math.max(0.15, Math.min(4, cam.scale * factor));
  cam.x = mx - worldX * cam.scale;
  cam.y = my - worldY * cam.scale;
}, { passive: false });

wrap.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  dragging = true; lastX = ev.clientX; lastY = ev.clientY;
  wrap.classList.add("dragging");
  wrap.setPointerCapture(ev.pointerId);
});
wrap.addEventListener("pointermove", ev => {
  const rect = wrap.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
  hover = hitTest(wx, wy);
  canvas.style.cursor = hover ? "pointer" : (dragging ? "grabbing" : "grab");
  if (dragging) {
    cam.x += ev.clientX - lastX;
    cam.y += ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY;
  }
});
wrap.addEventListener("pointerup", ev => {
  const wasDrag = Math.hypot(ev.clientX - lastX, ev.clientY - lastY);
  dragging = false; wrap.classList.remove("dragging");
  const rect = wrap.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const wx = (mx - cam.x) / cam.scale, wy = (my - cam.y) / cam.scale;
  const n = hitTest(wx, wy);
  if (n) selectNode(n);
});
wrap.addEventListener("pointerleave", () => { dragging = false; hover = null; });

function hitTest(wx, wy) {
  // reverse for top-most
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (filterHide(n)) continue;
    const dx = wx - n.x, dy = wy - n.y;
    const rr = (n.r + 4) / (n.kind === "rule" ? 1 : 1);
    if (dx * dx + dy * dy <= (n.r + 6) * (n.r + 6)) return n;
  }
  return null;
}

function filterHide(n) {
  if (!searchQ) return false;
  const q = searchQ.toLowerCase();
  if (n.kind === "section") {
    return !(n.label.toLowerCase().includes(q) || (n.rules || []).some(r => ruleMatch(r, q)));
  }
  if (n.kind === "rule") return !ruleMatch(n.rule, q);
  if (n.kind === "policy" || n.kind === "pool" || n.kind === "upstream") {
    return !((n.label || "").toLowerCase().includes(q) || (n.policy || "").toLowerCase().includes(q));
  }
  return false;
}
function ruleMatch(r, q) {
  return (r.raw || "").toLowerCase().includes(q)
    || (r.value || "").toLowerCase().includes(q)
    || (r.policy || "").toLowerCase().includes(q)
    || (r.type || "").toLowerCase().includes(q)
    || (sectionLabel[r.section] || "").toLowerCase().includes(q);
}

function selectNode(n) {
  selected = n;
  showTab("detail");
  renderDetail(n);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "detail"));
}

function renderDetail(n) {
  const el = document.getElementById("panel-body");
  if (!n) { el.innerHTML = '<p class="hint">点击节点查看详情。</p>'; return; }
  if (n.kind === "section") {
    const rules = n.rules || [];
    const filtered = searchQ ? rules.filter(r => ruleMatch(r, searchQ.toLowerCase())) : rules;
    let html = `<div class="kv">
      <div class="k">类型</div><div class="v">规则分段</div>
      <div class="k">名称</div><div class="v">${esc(n.label)}</div>
      <div class="k">规则数</div><div class="v">${rules.length}${searchQ ? "（过滤后 " + filtered.length + "）" : ""}</div>
    </div><p class="hint">点击下方规则行查看完整内容；或开启「展开全部规则节点」。</p>`;
    filtered.forEach(r => {
      const pk = policyKey(r.policy);
      html += `<div class="list-item" data-rid="${esc(r.id)}">
        <div><span class="tag ${pk}">${esc(r.policy)}</span>
        ${r.remote ? '<span class="tag other">远程集</span>' : ""}
        ${(r.flags||[]).map(f=>'<span class="tag other">'+esc(f)+'</span>').join("")}
        </div>
        <div>${esc(r.type)} · ${esc((r.value||"").slice(0,60))}</div>
        <div class="t">${esc(r.raw.slice(0,120))}</div>
      </div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll(".list-item").forEach(item => {
      item.addEventListener("click", () => {
        const r = DATA.rules.find(x => x.id === item.dataset.rid);
        if (r) renderRuleDetail(r);
      });
    });
    return;
  }
  if (n.kind === "rule") { renderRuleDetail(n.rule); return; }
  if (n.kind === "policy" || n.kind === "pool" || n.kind === "upstream") {
    const g = n.group;
    const related = DATA.rules.filter(r => r.policy === (n.policy || n.label.replace(/ \(token.*/, "")));
    const pname = n.policy || (g && g.name) || n.label;
    let html = `<div class="kv">
      <div class="k">类型</div><div class="v">${esc(n.kind)} ${g ? "· " + esc(g.type) : ""}</div>
      <div class="k">名称</div><div class="v">${esc(pname)}</div>
      <div class="k">命中规则</div><div class="v">${DATA.policy_counts[pname] || related.length || 0}</div>
    </div>`;
    if (g) {
      html += `<div class="kv">
        <div class="k">隐藏池</div><div class="v">${g.hidden ? "是" : "否"}</div>
        <div class="k">引用组</div><div class="v">${esc((g.include||[]).join(", ") || "—")}</div>
        <div class="k">过滤</div><div class="v">${esc((g.params && g.params["policy-regex-filter"]) || "—")}</div>
        <div class="k">订阅</div><div class="v">${esc((g.params && g.params["policy-path"]) || "—")}</div>
      </div>
      <div class="raw">${esc(g.raw || "")}</div>`;
    }
    html += `<p class="hint" style="margin-top:10px">关联规则（最多 40 条）</p>`;
    related.slice(0, 40).forEach(r => {
      html += `<div class="list-item" data-rid="${esc(r.id)}"><div class="t">${esc(r.section)}</div>${esc(r.raw.slice(0,100))}</div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll(".list-item").forEach(item => {
      item.addEventListener("click", () => {
        const r = DATA.rules.find(x => x.id === item.dataset.rid);
        if (r) renderRuleDetail(r);
      });
    });
  }
}

function renderRuleDetail(r) {
  const pk = policyKey(r.policy);
  const el = document.getElementById("panel-body");
  el.innerHTML = `<div class="kv">
    <div class="k">来源</div><div class="v">${r.source === "module" ? "模块 sgmodule" : "主配置 conf"}</div>
    <div class="k">分段</div><div class="v">${esc(sectionLabel[r.section] || r.section)}</div>
    <div class="k">序号</div><div class="v">#${r.order}</div>
    <div class="k">类型</div><div class="v">${esc(r.type)}${r.remote ? ' <span class="tag other">远程集 · 未展开</span>' : ""}</div>
    <div class="k">匹配值</div><div class="v">${esc(r.value || "—")}</div>
    <div class="k">策略</div><div class="v"><span class="tag ${pk}">${esc(r.policy)}</span></div>
    <div class="k">标志</div><div class="v">${(r.flags && r.flags.length) ? r.flags.map(f=>'<span class="tag other">'+esc(f)+'</span>').join(" ") : "—"}</div>
  </div>

  ${r.remote ? '<p class="hint">此为远程 RULE-SET / DOMAIN-SET，仅显示 URL，不下载展开内容。</p>' : ""}`;
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

      ${m.scripts.map(x => '<div class="list-item"><strong>'+esc(x.name)+'</strong><div class="t">'+esc(x.raw.slice(0,160))+'</div></div>').join("")}

      <div class="k">DoH</div><div class="v">${esc(g["encrypted-dns-server"])}</div>
      <div class="k">hijack-dns</div><div class="v">${esc(g["hijack-dns"])}</div>
      <div class="k">skip-proxy</div><div class="v">${esc(g["skip-proxy"])}</div>
      <div class="k">IPv6</div><div class="v">${esc(g.ipv6)}</div>

    </div>

// ---------- Draw ----------
function worldToScreen(x, y) {
  return [x * cam.scale + cam.x, y * cam.scale + cam.y];
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // subtle grid
  ctx.save();
  ctx.strokeStyle = "rgba(40,70,120,0.15)";
  ctx.lineWidth = 1;
  const step = 60 * cam.scale;
  const ox = cam.x % step, oy = cam.y % step;
  for (let x = ox; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = oy; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  // Layer titles (match LX)
  const titles = [
    [100, (I18N[uiLang]||I18N.en).layerA],
    [560, (I18N[uiLang]||I18N.en)[expandAll ? "layerBExpand" : "layerBCluster"]],
    [1050, (I18N[uiLang]||I18N.en).layerC],
    [1500, (I18N[uiLang]||I18N.en).layerD]
  ];
  titles.forEach(([x, t]) => {
    const [sx, sy] = worldToScreen(x, 24);
    if (sy > -20 && sy < H) {
      ctx.font = "11px sans-serif";
      ctx.fillStyle = "rgba(122,143,176,0.85)";
      ctx.fillText(t, sx - 30, Math.max(14, sy - 28));
    }
  });

  const focusId = (hover && hover.id) || (selected && selected.id) || null;
  function edgeHot(e) {
    if (!focusId) return false;
    return (e.a && e.a.id === focusId) || (e.b && e.b.id === focusId);
  }

  // Edges — very low alpha by default; full opacity when incident to hover/selection
  edges.forEach(e => {
    if (filterHide(e.a) || filterHide(e.b)) return;
    const hot = edgeHot(e);
    const [x1, y1] = worldToScreen(e.a.x, e.a.y);
    const [x2, y2] = worldToScreen(e.b.x, e.b.y);
    const mx = (x1 + x2) / 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
    const base = (typeof e.color === "string" && e.color.startsWith("#") && e.color.length === 7)
      ? e.color : (e.a.color || "#6480ff");
    ctx.strokeStyle = base;
    ctx.globalAlpha = hot ? 0.85 : 0.10;
    ctx.lineWidth = hot ? Math.max(1.4, e.weight * 1.1) : Math.max(0.5, e.weight * 0.55);
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // Particles — only on highlighted (hot) edges
  if (animOn && focusId) {
    particles.forEach(p => {
      const e = p.e;
      if (!edgeHot(e)) return;
      if (filterHide(e.a) || filterHide(e.b)) return;
      p.t += p.speed;
      if (p.t > 1) p.t = 0;
      const [x1, y1] = worldToScreen(e.a.x, e.a.y);
      const [x2, y2] = worldToScreen(e.b.x, e.b.y);
      const t = p.t;
      const mx = (x1 + x2) / 2;
      const u = 1 - t;
      const px = u*u*u*x1 + 3*u*u*t*mx + 3*u*t*t*mx + t*t*t*x2;
      const py = u*u*u*y1 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y2;
      const col = (e.a.color || "#4de1ff");
      ctx.beginPath();
      ctx.arc(px, py, p.r * (0.8 + 0.4 * cam.scale), 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.9;
      ctx.shadowColor = col;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    });
  }

  // Nodes + label LOD (min ~17px vertical gap per layer on screen)
  const lastLabelY = { A: -1e9, B: -1e9, C: -1e9, D: -1e9 };
  const LABEL_GAP = 17;

  nodes.forEach(n => {
    if (filterHide(n)) return;
    const [sx, sy] = worldToScreen(n.x, n.y);
    if (sx < -80 || sy < -80 || sx > W + 80 || sy > H + 80) return;
    const r = n.r * (n.kind === "rule" ? Math.max(0.45, Math.min(1.0, cam.scale)) : Math.max(0.4, Math.min(1.05, cam.scale)));
    const isSel = selected && selected.id === n.id;
    const isHov = hover && hover.id === n.id;

    ctx.beginPath();
    ctx.arc(sx, sy, r + (isHov || isSel ? 3 : 0), 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.globalAlpha = 0.95;
    ctx.shadowColor = n.color;
    ctx.shadowBlur = isSel ? 18 : 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    if (isSel || isHov) {
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // ring for remote
    if (n.remote || (n.kind === "rule" && n.rule && n.rule.remote)) {
      ctx.beginPath();
      ctx.arc(sx, sy, r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.setLineDash([2, 2]);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Label LOD
    const layer = n.layer || "?";
    const spaced = (sy - (lastLabelY[layer] || -1e9)) >= LABEL_GAP;
    const wantLabel = isHov || isSel || spaced;
    const ruleOk = n.kind !== "rule" || cam.scale > 1.15 || isHov || isSel;

    if (wantLabel && ruleOk) {
      lastLabelY[layer] = sy;
      ctx.fillStyle = isHov || isSel ? "#fff" : "rgba(200,220,255,0.9)";
      if (n.kind === "section") {
        // two-line: title + count
        ctx.font = "11px sans-serif";
        const t1 = n.label;
        const tw1 = ctx.measureText(t1).width;
        ctx.fillText(t1, sx - tw1 / 2, sy + r + 14);
        ctx.font = "9px sans-serif";
        ctx.fillStyle = isHov || isSel ? "rgba(255,255,255,0.85)" : "rgba(160,190,230,0.85)";
        const t2 = "(" + n.count + ")";
        const tw2 = ctx.measureText(t2).width;
        ctx.fillText(t2, sx - tw2 / 2, sy + r + 26);
      } else if (n.kind === "policy") {
        ctx.font = "11px sans-serif";
        let label = n.label + (n.count ? "  ·" + n.count : "");
        const tw = ctx.measureText(label).width;
        ctx.fillText(label, sx - tw / 2, sy + r + 14);
      } else if (n.kind === "rule") {
        ctx.font = "9px sans-serif";
        const label = shortLabel(n.rule);
        ctx.fillText(label, sx + r + 4, sy + 3);
      } else {
        ctx.font = "11px sans-serif";
        const label = n.label;
        const tw = ctx.measureText(label).width;
        ctx.fillText(label, sx - tw / 2, sy + r + 14);
      }
    } else if (n.kind === "section" && !wantLabel) {
      // compact count badge inside node when label skipped
      ctx.font = "10px sans-serif";
      ctx.fillStyle = "#fff";
      const badge = String(n.count);
      ctx.fillText(badge, sx - ctx.measureText(badge).width / 2, sy + 3);
    }
  });

  requestAnimationFrame(draw);
}

let uiLang = localStorage.getItem('surge_map_lang') || 'en';

function setLang(lang) {
  uiLang = lang;
  localStorage.setItem('surge_map_lang', lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  const t = I18N[lang];
  const h1 = document.querySelector('header h1');
  if (h1) h1.textContent = t.title;
  const enBtn = document.getElementById('lang-en');
  const zhBtn = document.getElementById('lang-zh');
  if (enBtn) enBtn.classList.toggle('active', lang === 'en');
  if (zhBtn) zhBtn.classList.toggle('active', lang === 'zh');
  const search = document.getElementById('search');
  if (search) search.placeholder = t.search;
  const expand = document.getElementById('btn-expand');
  if (expand) expand.textContent = (typeof expandAll !== 'undefined' && expandAll) ? t.cluster : t.expand;
  const reset = document.getElementById('btn-reset');
  if (reset) reset.textContent = t.reset;
  const anim = document.getElementById('btn-anim');
  if (anim) anim.textContent = (typeof animOn !== 'undefined' && animOn) ? t.animOn : t.animOff;
  document.querySelectorAll('[data-tab]').forEach(el => {
    const k = el.getAttribute('data-tab');
    if (k === 'stats') el.textContent = t.tabStats;
    if (k === 'detail') el.textContent = t.tabDetail;
    if (k === 'module') el.textContent = t.tabModule;
    if (k === 'general') el.textContent = t.tabGeneral;
  });
  const hint = document.querySelector('.callout, #hint, .hint');
  if (hint) hint.textContent = t.hint;
  const footer = document.querySelector('footer');
  if (footer) {
    // keep completeness numbers; replace leading descriptive part if simple
    footer.setAttribute('data-i18n-footer', '1');
  }
  window.__layerTitles = lang === 'zh'
    ? [[100, t.layerA],[560, t.layerBExpand],[1050, t.layerC],[1500, t.layerD]]
    : [[100, t.layerA],[560, t.layerBExpand],[1050, t.layerC],[1500, t.layerD]];
  // fix B title based on expandAll
  if (typeof expandAll !== 'undefined') {
    window.__layerTitles[1][1] = expandAll ? t.layerBExpand : t.layerBCluster;
  }
}
