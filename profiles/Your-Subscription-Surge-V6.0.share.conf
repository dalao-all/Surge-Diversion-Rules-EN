RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules-EN/main/mirrors/skk/List/non_ip/apple_cn.conf,DIRECT
DOMAIN-SUFFIX,mzstatic.com,DIRECT

# 快速失败已知死域名（省去 3.5 秒超时挂起）
DOMAIN,drive-cn.dirvt.com,REJECT
DOMAIN,sync-v.dirvt.com,REJECT
DOMAIN,sealine.youku.com,REJECT
