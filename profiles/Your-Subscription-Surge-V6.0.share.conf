# ================================================================
# 1.3 关键前置补丁（小型 RULE-SET，必须先于远程 SKK 广告底座）
# 维护模型（兴趣驱动，不改本段业务规则）：见 docs/MAINTENANCE.md 与 docs/INTEREST_MODEL.md；
# 日程 Asia/Shanghai 09:00/21:00 只吸收与种子相关的上游新增到自有 patches/*.list。
# 相对修订 2：关键例外迁入 patches/*.list，避免主配置双写；策略由本段 RULE-SET 行指定。
# 也可改成本地相对路径，例如：RULE-SET,patches/ai-critical.list,"🤖 AI住宅",update-interval=86400
# V6.0：RULE-SET 指向公开仓 dalao-all/Surge-Diversion-Rules。也可改本地相对路径，例如 RULE-SET,patches/ai-critical.list,"🤖 AI住宅",update-interval=86400
# finance-bybit-eu / finance-bybit-global 是 finance-critical 家族的极小伴生文件
# （Surge RULE-SET 整文件共用一个策略，故 Bybit EU/Global 不能塞进同一 list）。
