[SSID Setting]
# TikTok 存档中 36/36 次 TFO 尝试失败；当前节点入口在 Wi-Fi 与蜂窝均禁用 TFO，减少失败握手。
TYPE:CELLULAR tfo-behaviour=force-disabled
TYPE:WIFI tfo-behaviour=force-disabled

[Host]
localhost = 127.0.0.1
localhost.weixin.qq.com = 127.0.0.1

[URL Rewrite]
^https?://(?:www\.)?(?:g|google)\.cn(?:/|$) https://www.google.com 302

[MITM]
# 必须复用自己的受信任个人 CA，或在 Surge 本机生成并完成系统信任。文件不附 CA 私钥。
# 日常的应用 MITM 名单由 V6.0 模块（Your-Subscription-AdBlock-V6.0.sgmodule）追加。不要添加 *。
# 关闭模块后，这里保持空名单；MITM 总开关可以继续为其他自用模块保留。
# 开启 MITM、HTTP 重写与脚本；关闭“捕获流量”和捕获里的全部解密覆盖。
h2 = true
auto-quic-block = true
skip-server-cert-verify = false
