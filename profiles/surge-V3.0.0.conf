RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/cn.list,DIRECT,update-interval=86400

DOMAIN-SUFFIX,cn,DIRECT
GEOIP,CN,DIRECT
FINAL,🌍 国际网络,dns-failed

