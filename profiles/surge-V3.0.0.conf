RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/protect-cn.list,DIRECT,update-interval=86400

DOMAIN-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/ads.domainset,REJECT,update-interval=86400

RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/paypal.list,💳 PayPal 美国,update-interval=86400
