RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/stream.list,🎬 流媒体,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/google.list,🔐 Google账户,update-interval=86400
RULE-SET,https://raw.githubusercontent.com/dalao-all/Surge-Diversion-Rules/main/dist/v4/uk.list,🇬🇧 英国专属,update-interval=86400
